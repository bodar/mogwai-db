name: CI

on:
  push:
    branches: [trunk]
  pull_request:

# `gates` + a fan-out of `rel-sweep` runners + a fan-out of `test` runners, because the gate is
# CPU-bound and a runner has only 4 cores.
#
# Measured on real CI: the wall is set by two fan-outs that run concurrently — `rel-sweep` and `test` —
# plus static gates that finish within 7s of install and hide entirely underneath them. Each bracket is
# one `bun test`, a single process using ~1.27 cores, so a single runner sat at roughly half idle while
# the wall was set by the longer pole. Sharding INSIDE a runner does not fix that (measured: 2 test
# shards ∥ 2 sweep shards on a 4-core pin took 66.8s against 72.9s unsharded — every extra bun process
# re-pays JIT warmup); more RUNNERS does. `rel-sweep` was ~120s on one runner against ~70s for the next
# test bracket, so it is the fan-out that matters most — see its job below.
#
# The `test` fan-out is by BRACKET, not anonymous shard: the `plan` job runs `test:bracket --matrix`
# to discover the bracket names (L1, L2, …, browser, other), and the `test` job spins one runner per
# bracket, named `test (L2)` in the UI. So a red run says WHICH layer broke — `test (L2)` → `mise run L2`
# locally — without opening a job. Brackets are DERIVED from discovery (`test/L<n>-…` → `L<n>`,
# `test/browser/…` → `browser`, else `other`; scripts/test-bracket.ts), so a new test file cannot escape
# every bracket and a new `test/L6-…/` dir becomes its own `L6` runner with no edit here. The `browser`
# bracket is the one that drives a real Chrome (preinstalled on the runner); it skips itself where no
# Chrome exists (`chromeAvailable()`), so it is safe in the aggregate. `other` is one runner for now —
# split it (cost-balance) only if it out-runs the largest L bracket, since the brackets run in
# parallel and the wall is the slowest one regardless.
#
# `mise run ci` remains the complete local one-command gate. The coverage here is identical by
# construction: `ci`'s dependency list is `gates` + `rel-sweep` + `test`, and the brackets partition
# test discovery so their union IS `test`. Add a job to one and it must be added to the other, or it
# becomes a gate that only fires on one side.
#
# Note CI wall time is NOT a reliable measurement of a change: six consecutive runs of near-identical
# work took 112, 139, 181, 189, 180 and 167s. Compare a task against `check` in the SAME run — a fixed
# tsc quantum — rather than against another run's clock.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run gates
        env:
          MOGWAI_SKIP_REFERENCE: "1"

  # THE longest pole, fanned across a runner matrix. Measured on real CI it was ~120s of compute where
  # the next runner was ~70s — a single 4-core box is core-starved below the sweep's own ~6 knee, so
  # more cores on one runner cannot fix it; more runners can. Each runner owns `index % RUNNERS === RUNNER`
  # of the corpus (scripts/rel-sweep.ts) and still shards its slice across its own cores.
  #
  # `strategy.job-total` IS the runner count, so the `runner:` list is the single source of truth:
  # adding a runner is one more entry and nothing else. The values MUST stay 0..N-1 and contiguous —
  # the partition is a modulo, so a gap or an out-of-range index would drop or duplicate traversals.
  # `needs['rel-sweep'].result` in the `ci` job is the matrix rollup (green only if every leg is), so
  # the aggregate gate needs no change.
  rel-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2]
    name: rel-sweep (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run rel-sweep
        env:
          MOGWAI_SKIP_REFERENCE: "1"
          SWEEP_RUNNERS: ${{ strategy.job-total }}
          SWEEP_RUNNER: ${{ matrix.runner }}

  # Discover the test brackets and hand them to `test` as a matrix. One extra job on the critical
  # path (~install + a sub-second script), the price of the bracket names being DERIVED rather than
  # hard-coded here: add `test/L6-…/` and it appears as a runner with no edit to this file.
  plan:
    runs-on: ubuntu-latest
    outputs:
      brackets: ${{ steps.brackets.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - id: brackets
        run: echo "list=$(bun scripts/test-bracket.ts --matrix)" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel sibling brackets on the first failure: the useful output of a red run is WHICH
      # tests fail, and killing the other brackets throws most of that away for ~40s of runner time.
      fail-fast: false
      matrix:
        bracket: ${{ fromJSON(needs.plan.outputs.brackets) }}
    name: test (${{ matrix.bracket }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run test:bracket
        env:
          MOGWAI_SKIP_REFERENCE: "1"
          MOGWAI_BRACKET: ${{ matrix.bracket }}

  # The single "did everything pass" signal, kept so there is one check name to read (and to require,
  # if trunk ever gains required checks — today the ruleset only enforces linear history).
  #
  # `if: always()` plus an explicit result test, NOT a bare `needs:`. Without it a failed dependency
  # leaves this job SKIPPED, and a skipped job is not a failed one — the aggregate would report
  # nothing rather than red.
  ci:
    runs-on: ubuntu-latest
    needs: [gates, rel-sweep, plan, test]
    if: always()
    steps:
      - name: Require every job to have succeeded
        # `plan` is required too: if it fails, the `test` matrix has nothing to run and reports
        # `skipped`, which is NOT `failure` — without gating on `plan` a broken discovery would let
        # a suite that ran ZERO tests read as green. A matrix job's `result` is the rollup: it is
        # `success` only if every bracket succeeded, so this one check covers all of them.
        run: |
          echo "gates=$GATES sweep=$SWEEP plan=$PLAN test=$TEST"
          [ "$GATES" = success ] && [ "$SWEEP" = success ] && [ "$PLAN" = success ] && [ "$TEST" = success ] || exit 1
          echo 'CI passed'
        env:
          GATES: ${{ needs.gates.result }}
          SWEEP: ${{ needs['rel-sweep'].result }}
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}

  # CONTINUOUS RELEASE — trunk-based: every push to trunk that passes the whole gate is published
  # automatically, no manual step and no tags to cut. Gated on the `ci` aggregate succeeding (so it never
  # ships a red commit) and on a direct push to trunk (never a PR). The derived version
  # (major·commit-count·run-number, scripts/version.ts) makes every commit a unique, monotonic release, so
  # two pushes cannot collide on a tag. Runs AFTER `ci`, so a trunk push costs the gate + the package/
  # cross-compile time; PRs pay nothing (the `if` skips them).
  release:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      # fetch-depth: 0 — scripts/version.ts counts commits from HEAD for the minor and REFUSES a shallow
      # clone; fetch-tags so `git log <prev-release-tag>..HEAD` (the notes) resolves the prior tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/provision
      # `mise run package` (NOT a bare `bun`) so its `install` dependency runs first — a direct `bun` call
      # skips it and node_modules (capnweb, sqlite-wasm, the linked client) is absent. package.ts derives
      # the SAME version this run's `gh` step reads (GITHUB_RUN_NUMBER fixes the patch), so names agree.
      - name: Build release artifacts
        run: mise run package
      # Notes from the COMMITS since the last release — trunk-based means direct pushes, no PRs, so GitHub's
      # PR-based --generate-notes would be empty. On the FIRST release (no prior tag) fall back to the head
      # commit rather than dumping the whole history.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(mise exec -- bun scripts/version.ts)"
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" \
            --title "v$V" \
            --notes-file notes.md \
            "dist/mogwai-db-$V-browser.zip" \
            "dist/mogwai-db-$V-cloudflare.zip" \
            dist/bin/mogwai-db-"$V"-*
