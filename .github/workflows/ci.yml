name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # Bun's DOWNLOAD cache (`bun pm cache`), not node_modules. Two reasons it must be this and
      # not the installed tree: `gremlin` is a `link:` dep resolving into the submodule, and
      # antlr4ng carries a load-bearing `bun patch` — both are things `bun install` DOES, and a
      # restored node_modules would skip them. With only the downloads cached, install still
      # resolves, links and patches; it just stops re-fetching.
      #
      # This is the variance it exists to remove: measured on trunk, the same 62 packages against
      # the same lockfile installed in 0.9s on one run and 51.6s on the next — a 57x swing on
      # identical work, which read as a 50% CI regression attributable to nothing in the diff.
      #
      # The key carries the submodule's pinned commit as well as the lockfile, because the same
      # cache also serves the submodule's own 839-package workspace install. That is load-bearing,
      # not cosmetic: actions/cache never re-saves an existing key, so a lockfile-only key would
      # cache those deps once and then re-download them on every run after a pin bump, forever.
      # Reading the pin from the superproject INDEX matches what scripts/init-submodule.sh
      # provisions, so a staged-but-uncommitted bump keys against the commit actually used.
      - id: pin
        run: echo "sha=$(git ls-files -s vendor/tinkerpop | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ steps.pin.outputs.sha }}
          restore-keys: |
            bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-${{ runner.os }}-

      # mise installs the pinned bun, then runs the build graph (test + build).
      - run: mise run ci
