name: CI

on:
  push:
    branches: [trunk]
  pull_request:

# FOUR JOBS, one runner each, because the gate is CPU-bound and a runner has 4 cores.
#
# Measured on trunk: the whole graph is two long poles that already run concurrently — `test` (117s)
# and `rel-sweep` (110s) — plus six static gates that finish within 7s of install and hide entirely
# underneath them. One `bun test` is a single process using ~1.27 cores, so a single runner sat at
# roughly half idle while the wall was set by the longer pole. Sharding INSIDE a runner does not fix
# that (measured: 2 test shards ∥ 2 sweep shards on a 4-core pin took 66.8s against 72.9s unsharded —
# every extra bun process re-pays JIT warmup); more runners does.
#
# `mise run ci` remains the complete local one-command gate. The coverage here is identical by
# construction: `ci`'s dependency list is `gates` + `rel-sweep` + `test`, and the three shards
# partition test discovery so their union IS `test` (scripts/test-shard.ts). Add a job to one and it
# must be added to the other, or it becomes a gate that only fires on one side.
#
# Note CI wall time is NOT a reliable measurement of a change: six consecutive runs of near-identical
# work took 112, 139, 181, 189, 180 and 167s. Compare a task against `check` in the SAME run — a fixed
# tsc quantum — rather than against another run's clock.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run gates
        env:
          MOGWAI_SKIP_REFERENCE: "1"

  # Its own job because it is the second pole: 110s, and nothing in the suite can start it earlier.
  rel-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run rel-sweep
        env:
          MOGWAI_SKIP_REFERENCE: "1"

  test:
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel sibling shards on the first failure: the useful output of a red run is WHICH
      # tests fail, and killing the other shards throws most of that away for ~40s of runner time.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: test (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/provision
      - run: mise run test:shard
        env:
          MOGWAI_SKIP_REFERENCE: "1"
          MOGWAI_SHARDS: "3"
          MOGWAI_SHARD: ${{ matrix.shard }}

  # The single "did everything pass" signal, kept so there is one check name to read (and to require,
  # if trunk ever gains required checks — today the ruleset only enforces linear history).
  #
  # `if: always()` plus an explicit result test, NOT a bare `needs:`. Without it a failed dependency
  # leaves this job SKIPPED, and a skipped job is not a failed one — the aggregate would report
  # nothing rather than red.
  ci:
    runs-on: ubuntu-latest
    needs: [gates, rel-sweep, test]
    if: always()
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "gates=$GATES sweep=$SWEEP test=$TEST"
          [ "$GATES" = success ] && [ "$SWEEP" = success ] && [ "$TEST" = success ] || exit 1
          echo 'CI passed'
        env:
          GATES: ${{ needs.gates.result }}
          SWEEP: ${{ needs['rel-sweep'].result }}
          TEST: ${{ needs.test.result }}
