name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # Bun's DOWNLOAD cache (`bun pm cache`), not node_modules. Two reasons it must be this and
      # not the installed tree: `gremlin` is a `link:` dep resolving into the submodule, and
      # antlr4ng carries a load-bearing `bun patch` — both are things `bun install` DOES, and a
      # restored node_modules would skip them. With only the downloads cached, install still
      # resolves, links and patches; it just stops re-fetching.
      #
      # This is the variance it exists to remove: measured on trunk, the same 62 packages against
      # the same lockfile installed in 0.9s on one run and 51.6s on the next — a 57x swing on
      # identical work, which read as a 50% CI regression attributable to nothing in the diff.
      #
      # The key carries the submodule's pinned commit as well as the lockfile, because the same
      # cache also serves the submodule's own 839-package workspace install. That is load-bearing,
      # not cosmetic: actions/cache never re-saves an existing key, so a lockfile-only key would
      # cache those deps once and then re-download them on every run after a pin bump, forever.
      # Reading the pin from the superproject INDEX matches what scripts/init-submodule.sh
      # provisions, so a staged-but-uncommitted bump keys against the commit actually used.
      - id: pin
        run: echo "sha=$(git ls-files -s vendor/tinkerpop | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ steps.pin.outputs.sha }}
          restore-keys: |
            bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-${{ runner.os }}-

      # ── the submodule root, in two phases so the client build can be cached ────────────────────
      #
      # `submodule` is the SERIAL ROOT of the task graph — `install` waits on it and all eight tasks
      # that fan out wait on `install` — so a second removed here is a second off the whole run.
      # Measured on trunk: 16.8s of a 93.7s run, of which the gremlin client build is ~7.7s (antlr
      # generate + duel's dual ESM/CJS emit) for an artifact that is a pure function of the pin.
      #
      # ORDER IS LOAD-BEARING. A fresh provision does `rm -rf vendor/tinkerpop` before cloning, so a
      # cache restored BEFORE the clone is deleted by it. Hence: clone first (`--submodules-only`
      # stops before the install/build/link), restore the build into the cloned tree, then let
      # `mise run ci` re-enter the `submodule` task — which finds the checkout already at the pin,
      # and skips the build because build/.mogwai-built-from matches. That stamp is the existing
      # guard, not something added for the cache: it lives INSIDE build/, so a build cannot outlive
      # the artifact it certifies, and a pin bump misses the key AND fails the stamp check.
      #
      # MOGWAI_SKIP_REFERENCE: this runner compiles and tests and never opens a source citation, so
      # it does not provision the two cited-never-executed checkouts (gremlin-core, vendor/calcite).
      # See scripts/init-submodule.sh for what that costs. Set on both steps — the second invocation
      # re-asserts the sparse set, so omitting it there would fetch gremlin-core back.
      - run: mise run submodule -- --submodules-only
        env:
          MOGWAI_SKIP_REFERENCE: "1"
      - uses: actions/cache@v6
        with:
          path: vendor/tinkerpop/gremlin-js/gremlin-javascript/build
          key: gremlin-client-${{ runner.os }}-${{ steps.pin.outputs.sha }}

      # mise runs the build graph (test + build).
      - run: mise run ci
        env:
          MOGWAI_SKIP_REFERENCE: "1"
