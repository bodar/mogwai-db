[tools]
bun = "latest"

[env]
# Keep wrangler non-interactive in CI (no telemetry prompt / phone-home).
WRANGLER_SEND_METRICS = "false"

# Build graph: install ─┬─▶ check ─┐
#                       ├─▶ test  ─┤
#                       └─▶ build ─┴─▶ ci
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]

[tasks.check]
description = "Type-check (tsc --noEmit); no emit — Bun/esbuild run the TS directly"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.submodule]
description = "Provision the pinned tinkerpop submodule (blobless+sparse) + cucumber runner deps"
run = "bash scripts/init-submodule.sh"

[tasks.test]
description = "Full suite: corpus + contract + L3 conformance (both runtimes)"
depends = ["install", "submodule"]
run = "bun test"

[tasks.generate]
description = "Regenerate parser/ from the submodule's origin/master Gremlin grammar (antlr-ng)"
depends = ["install", "submodule"]
run = "bash scripts/generate-parser.sh"

[tasks.regen-corpus]
description = "Re-extract conformance corpus.txt from the submodule's origin/master Gherkin features"
depends = ["submodule"]
run = "bun run test/conformance/regen-corpus.ts"

[tasks.build]
description = "Bundle the Cloudflare Worker (dry-run deploy)"
depends = ["install"]
run = "bunx wrangler deploy --dry-run --outdir dist"

[tasks.ci]
description = "CI gate: type-check + test + worker build"
depends = ["check", "test", "build"]
run = "echo 'CI passed'"
