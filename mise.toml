[tools]
# Pinned for reproducibility (CI installs exactly this; the web-session hook links
# the image's pre-installed bun under this version — see .claude/hooks/session-start.sh).
bun = "1.3.11"

[env]
# Keep wrangler non-interactive in CI (no telemetry prompt / phone-home).
WRANGLER_SEND_METRICS = "false"

# Build graph: install ─┬─▶ check ─┐
#                       ├─▶ test  ─┤
#                       └─▶ build ─┴─▶ ci
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]

[tasks.check]
description = "Type-check (tsc --noEmit); no emit — Bun/esbuild run the TS directly"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.submodule]
description = "Provision the pinned tinkerpop submodule (blobless+sparse) + cucumber runner deps"
run = "bash scripts/init-submodule.sh"

# Every test task depends on `check` (tsc --noEmit): `bun test` runs TS WITHOUT type-checking,
# so a test run must gate on the type-check first — else a type error ships green under a bare
# `bun test` (which is how the build once went red after a refactor passed its tests).
[tasks.test]
description = "Full suite: corpus + contract + L3 conformance (both runtimes)"
depends = ["install", "check", "submodule"]
run = "bun test"

# Conformance ladder — invoke a single level directly. L1/L2 are pure (no submodule);
# L3/L4 drive the vendored cucumber corpus + reference graphs, so they depend on it.
[tasks.L1]
description = "L1 — corpus parse+chain (2,298 canonical traversals; no submodule)"
depends = ["install", "check"]
run = "bun test test/L1-corpus"

[tasks.L2]
description = "L2 — SQL snapshots (compile-to-SQL contract; no submodule)"
depends = ["install", "check"]
run = "bun test test/L2-sql"

[tasks.L3]
description = "L3 — official TinkerPop cucumber conformance over GraphBinary (ratcheted)"
depends = ["install", "check", "submodule"]
run = "bun test test/L3-conformance"

[tasks.L4]
description = "L4 — our addendum Gherkin suite (gap coverage; all must pass)"
depends = ["install", "check", "submodule"]
run = "bun test test/L4-addendum"

[tasks.L5]
description = "L5 — property-based fast-path differential (fixed seed)"
# `submodule`, NOT just install/check like L1/L2: the differential EXECUTES its traversals through
# the real Executor, which frames results via src/io.ts → `gremlin/io` — an export only the
# submodule-linked client has (npm's newest v4 is beta.2, which lacks it). L1/L2 are genuinely
# submodule-free because they only parse and compile; anything that runs a traversal is not.
depends = ["install", "check", "submodule"]
run = "bun test test/L5-properties"

# Exploration, NOT a gate: a random seed and a much larger sample. Findings get diagnosed into
# test/L5-properties/known.ts (or fixed), then promoted into an L4 .feature so the floor rises.
# Deliberately not in `ci` — a random-seed property test that fails intermittently is one people
# learn to ignore.
[tasks.L5-random]
description = "L5 exploration — random seed, 3000 generated traversals (not a CI gate)"
depends = ["install", "check", "submodule"]
run = "L5_SEED=$RANDOM L5_RUNS=3000 bun test test/L5-properties"

# The refactor guard, NOT a ladder level: it asserts nothing about correctness, only that behaviour
# has not CHANGED. `submodule` because it executes traversals (same reason as L5).
[tasks.census]
description = "Census — the refactor guard: every corpus traversal's outcome vs the committed baseline"
depends = ["install", "check", "submodule"]
run = "bun test test/census"

# Re-record the baseline. Deliberately a command rather than the test rewriting itself: the census
# is a two-way baseline, so an auto-record would launder the very regression it exists to catch.
[tasks.census-record]
description = "Re-record the census baseline (prints the delta first; commit the two .tsv files)"
depends = ["install", "check", "submodule"]
run = "bun run test/census/record.ts"

[tasks.generate]
description = "Regenerate parser/ from the submodule's origin/master Gremlin grammar (antlr-ng)"
depends = ["install", "submodule"]
run = "bash scripts/generate-parser.sh"

[tasks.regen-corpus]
description = "Re-extract the L1 corpus.txt from the submodule's origin/master Gherkin features"
depends = ["submodule"]
run = "bun run test/L1-corpus/regen-corpus.ts"

[tasks.build]
description = "Bundle the Cloudflare Worker (dry-run deploy)"
# `submodule`, not just `install`: the worker bundles src/io.ts, which imports `gremlin/io`
# (and a deep StreamReader path) from the SUBMODULE client. npm's newest v4 is still
# 4.0.0-beta.2, which has no `./io` export — so without the bun link this resolves to
# beta.2 and the bundle fails to build. Locally the link usually already exists, which is
# why this only ever went red in CI.
depends = ["install", "submodule"]
run = "bunx wrangler deploy --dry-run --outdir dist"

[tasks.ci]
description = "CI gate: type-check + test + worker build"
depends = ["check", "test", "build"]
run = "echo 'CI passed'"
