[tools]
bun = "latest"

[env]
# Keep wrangler non-interactive in CI (no telemetry prompt / phone-home).
WRANGLER_SEND_METRICS = "false"

# Build graph: install ─┬─▶ check ─┐
#                       ├─▶ test  ─┤
#                       └─▶ build ─┴─▶ ci
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]

[tasks.check]
description = "Type-check (tsc --noEmit); no emit — Bun/esbuild run the TS directly"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.submodule]
description = "Provision the pinned tinkerpop submodule (blobless+sparse) + cucumber runner deps"
run = "bash scripts/init-submodule.sh"

[tasks.test]
description = "Full suite: corpus + contract + L3 conformance (both runtimes)"
depends = ["install", "submodule"]
run = "bun test"

# Conformance ladder — invoke a single level directly. L1/L2 are pure (no submodule);
# L3/L4 drive the vendored cucumber corpus + reference graphs, so they depend on it.
[tasks.L1]
description = "L1 — corpus parse+chain (2,298 canonical traversals; no submodule)"
depends = ["install"]
run = "bun test test/L1-corpus"

[tasks.L2]
description = "L2 — SQL snapshots (compile-to-SQL contract; no submodule)"
depends = ["install"]
run = "bun test test/L2-sql"

[tasks.L3]
description = "L3 — official TinkerPop cucumber conformance over GraphBinary (ratcheted)"
depends = ["install", "submodule"]
run = "bun test test/L3-conformance"

[tasks.L4]
description = "L4 — our addendum Gherkin suite (gap coverage; all must pass)"
depends = ["install", "submodule"]
run = "bun test test/L4-addendum"

[tasks.generate]
description = "Regenerate parser/ from the submodule's origin/master Gremlin grammar (antlr-ng)"
depends = ["install", "submodule"]
run = "bash scripts/generate-parser.sh"

[tasks.regen-corpus]
description = "Re-extract the L1 corpus.txt from the submodule's origin/master Gherkin features"
depends = ["submodule"]
run = "bun run test/L1-corpus/regen-corpus.ts"

[tasks.build]
description = "Bundle the Cloudflare Worker (dry-run deploy)"
depends = ["install"]
run = "bunx wrangler deploy --dry-run --outdir dist"

[tasks.ci]
description = "CI gate: type-check + test + worker build"
depends = ["check", "test", "build"]
run = "echo 'CI passed'"
