[tools]
bun = "latest"

[env]
# Keep wrangler non-interactive in CI (no telemetry prompt / phone-home).
WRANGLER_SEND_METRICS = "false"

# Build graph: install ─┬─▶ test ─┐
#                       └─▶ build ─┴─▶ ci
[tasks.install]
description = "Install dependencies"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]

[tasks.test]
description = "Full suite: corpus + contract on both runtimes (Bun + live DO)"
depends = ["install"]
run = "bun test"

[tasks.build]
description = "Bundle the Cloudflare Worker (dry-run deploy)"
depends = ["install"]
run = "bunx wrangler deploy --dry-run --outdir dist"

[tasks.ci]
description = "CI gate: test + worker build"
depends = ["test", "build"]
run = "echo 'CI passed'"
