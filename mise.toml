# `[task_config] shell` below does not exist before this version: an older mise WARNs
# (`unknown field in …: task_config.shell`) and runs every task through the default shell, so the
# per-task logs silently never appear — a missing safety net that looks exactly like a working one.
# Fail closed instead. (The other spelling, the `unix_default_inline_shell_args` SETTING, is not the
# escape hatch it looks like: 2026.8.x refuses it from a non-global config "for security reasons",
# so a project cannot set its own task shell that way at all.)
min_version = "2026.8.2"

[tools]
# Pinned for reproducibility (CI installs exactly this; the web-session hook links
# the image's pre-installed bun under this version — see .claude/hooks/session-start.sh).
bun = "1.3.11"
node = "22.22.2"

[env]
# Keep wrangler non-interactive in CI (no telemetry prompt / phone-home).
WRANGLER_SEND_METRICS = "false"

# How many TASKS mise may run concurrently (default is a fixed 8, not core-scaled). Must be a static
# integer — `"{{ num_cpus() }}"` is rejected (`expected usize`), and setting MISE_JOBS via [env] is
# resolved too late to affect scheduling (both measured). 24 guarantees our ~9-task-wide DAG (the 3 top
# `ci` tasks + `gates`' 6 deps) never waits on a slot on this box, and is harmless on a 4-core CI runner
# (it only lets `gates`' six ~7s deps briefly oversubscribe). NOTE this is NOT the workload's real
# parallelism knob: the heavy CPU load is the CHILD PROCESSES the orchestrator scripts spawn
# (scripts/test-all.ts ≈ one `bun test` per bracket; scripts/rel-sweep.ts = min(6, cores)), which read
# the core count themselves and ignore `jobs`. The "leave cores free" headroom lives THERE
# (test-all.ts caps at cores−2), not here.
[settings]
jobs = 24

# Every task runs through scripts/teeshell.sh, which tees its combined stdout+stderr to
# `.logs/<task>.log` (the last run of that task) and prints the path. So a run's full output
# is always in a file to `grep`/`Read` — no re-running a suite just because a `tail` or `grep`
# swallowed the part you needed. This is the task SHELL rather than a `tee` per `run =` on
# purpose: dependencies execute as sibling tasks whose output never reaches a parent's in-`run`
# tee, so the shell is the only seam that catches EVERY task — `mise run ci` leaves one clean
# log per sub-task. Header of the script has the full rationale + the `raw = true` escape hatch.
#
# Needs mise >= 2026.8.2 — hence the `min_version` at the top of this file, whose comment has the
# failure mode. `{{config_root}}` is required, not decoration: the path is exec'd from the TASK's
# cwd, so a relative one would break the moment a task sets `dir = …`.
[task_config]
shell = "{{config_root}}/scripts/teeshell.sh -c"

# Build graph: submodule ─▶ install ─┬─▶ check ─┐
#                                    ├─▶ test  ─┤
#                                    └─▶ build ─┴─▶ ci
#
# The `submodule ─▶ install` edge is LOAD-BEARING, not tidiness. package.json declares
# `"gremlin": "link:gremlin"`, which resolves against the link `bun link` registers from inside the
# submodule — so without the submodule provisioned first, `bun install` FAILS
# (`FileNotFound: failed linking dependency/workspace … for package gremlin`, exit 1) instead of
# silently resolving npm's 4.0.0-beta.2. That failure IS the feature: beta.2 is now unreachable by
# construction rather than installed-then-overwritten. The cost, taken deliberately: nothing is
# submodule-free any more, `check`/`L1`/`L2` included. What it buys is that a bare `bun install`
# can no longer swap the client out from under us — which it did at every web-session start, since
# the session hook runs `mise run install`.
[tasks.install]
description = "Install dependencies (needs the submodule: gremlin is a link: dep)"
depends = ["submodule"]
run = "bun install"
sources = ["package.json", "bun.lock"]
# `node_modules/gremlin` is named alongside `node_modules` deliberately. Recreating the client
# symlink is now `bun install`'s job (it is a link: dep), so mise skipping this task on a
# sources-up-to-date check would leave the link missing — bare `node_modules` exists, so the coarse
# check passes while the one path everything imports through is gone. Measured: with only
# `node_modules` listed, `mise run install` printed "sources up-to-date, skipping" and left no link.
outputs = ["node_modules", "node_modules/gremlin"]

# ── INCREMENTAL: `sources` so a re-run skips when nothing changed ────────────────────────────────
# Every deterministic, file-driven task below carries a `sources` glob. mise then skips it
# ("sources up-to-date, skipping") when no listed file has a newer mtime than the last run, and reruns
# otherwise. This is what makes the LLM double-run cheap — `mise run test` then `mise run ci` no longer
# re-executes the identical suite (the whole `ci` graph — gates + rel-sweep + test — becomes a no-op on
# the second call when the tree is unchanged). It is invisible to CI, which starts from a fresh checkout
# every time.
#
# Freshness is mtime-based, which is the SAFE direction: any edit, `git checkout`, or `touch` bumps the
# mtime and forces a rerun, so it can never WRONGLY SKIP after a change to a listed file. The globs are a
# deliberate SUPERSET of what each task reads (over-listing only costs an occasional extra run;
# UNDER-listing could ship a stale green, so we never trim below what a task consumes).
#
# GLOB FORM IS LOAD-BEARING: use `dir/**/*`, never a bare `dir/**`. mise's source globber matches
# NOTHING for a bare `**` (measured), which silently gives a task an EMPTY source set — so it runs once
# and then skips forever regardless of edits (a wrongly-skip that reads as "brilliantly fast" and can
# ship a stale green). `**/*` matches files at every depth, including directly under `dir/`. This shipped
# broken once; if you add a task, copy an existing `sources` line, don't hand-write a bare `**`.
#
# THE `!` EXCLUSIONS ARE LOAD-BEARING TOO: the suite WRITES gitignored artifacts UNDER `test/`
# (`test/**/l3-telemetry.*` from L3, `test/**/.wrangler/**` from the real-workerd cloudflare test), which
# `test/**/*` would otherwise match — so every run rewrote a "source", making the task ALWAYS re-run (and
# poisoning the gates that share this glob). Excluding them is what makes the incremental actually
# incremental. mise honours `!` negations (measured); they do NOT auto-track .gitignore, so a NEW
# generated-under-`test/` artifact must be added here (or written outside the source tree, e.g. `.logs/`).
#
# TWO inputs the globs deliberately do NOT capture — both caught by CI, which starts from a fresh
# checkout on every push and is the gate of record (see the "CI green only after push" rule), so
# neither is ever lost at the real gate; the skip is a purely LOCAL convenience:
#   1. The L3/L4 conformance corpus (`.feature` files) is read straight from the `vendor/tinkerpop`
#      submodule (a symlink in a linked worktree; globbing it is fragile), so a submodule PIN BUMP that
#      changes the corpus without touching `src/`/`test/` would be skipped locally.
#   2. L5's seed is derived from git HEAD, so a re-run at the SAME commit is genuinely identical
#      (deterministic → safe to skip), but a re-run after a NEW commit that touched no `src/`/`test/`
#      file would skip L5 with the old seed and miss that HEAD's exploration locally.
# After a pin bump or when you specifically want a fresh L5 seed locally, force a rerun with
# `mise run --force <task>` (cascades to deps, so `--force ci` re-runs the whole gate) — or `touch` a
# source. The skip STATE lives in mise's global state dir, ~/.local/state/mise/task-sources/ (one small
# hash-named file per project+task), NOT in the repo or .logs/; `rm -rf` that dir resets every task.
[tasks.check]
description = "Type-check (tsc --noEmit); no emit — Bun/esbuild run the TS directly"
depends = ["install"]
run = "bunx tsc --noEmit"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# Sits next to `check`, NOT in the ladder. L1–L5 assert runtime behaviour over traversals; this
# asserts a STATIC property of the source, so numbering it "L6" would break what the ladder means.
# `depends = ["install"]` only, deliberately: the LSP reads source, so this needs no submodule, no
# graph and no traversal execution — unlike every ladder level and the census.
#
# Not a ratchet. It passes at zero today, so the gate is zero; a committed allowlist would only be
# somewhere for a real violation to hide. A deliberate exception goes in the script as ONE named
# entry with a diagnosis, the way test/L5-properties/known.ts does.
[tasks.arch]
description = "Architectural invariants: no Pass reaches ChainFacts or the fast-path layer"
depends = ["install"]
run = "bun scripts/arch-check.ts"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# The three unused-code flags, which cannot live in tsconfig.json because generated `parser/` fails
# them and must never be hand-edited. Every config-level exemption was measured and none work — the
# long comment in tsconfig.json is the record — so the exemption is invocation-scoped: run tsc with
# the flags, filter `parser/` out of the OUTPUT, and print what was filtered rather than dropping it
# silently. Same `depends` reasoning as `arch`: source only, no submodule, no graph.
[tasks.lint]
description = "Unused-code checks over our source (generated parser/ is exempt — see tsconfig.json)"
depends = ["install"]
run = "bun scripts/lint.ts"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# The third gate in the `arch`/`lint` mould, and the one that stops the DO 100-bind class of defect
# coming back: no statement's bind list may be a function of ROW COUNT (src/rowbatch.ts is the
# answer, src/cf-limits.ts the runtime instrument). Same `depends` reasoning as `arch` and `lint` —
# it reads source through the LSP, so no submodule, no graph, no traversal execution.
#
# Also not a ratchet: zero violations IS the gate, so a new one fails the build rather than widening
# an allowlist.
[tasks.binds]
description = "Bind-budget invariants: no bind list sized by row count outside RowBatch"
depends = ["install"]
run = "bun scripts/binds-check.ts"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# An INSTRUMENT, not a gate, and deliberately absent from `ci`. An export with zero references is a
# question, not a verdict: DI-registered leaves, names reached through the service registry, symbols
# used only by a .feature step, and the worker/server entry points all look dead to a reference
# query. Gating it would need an allowlist (somewhere for a real orphan to hide) or would force a
# deletion the tool is explicitly not confident enough to make.
[tasks.orphans]
description = "Report exports nothing imports (instrument, not a gate — findings need judgement)"
depends = ["install"]
run = "bun scripts/orphans.ts"
[tasks.rel-blockers]
description = "RelIR worklist: where the fold gives up, per step and per family (instrument — needs judgement)"
depends = ["install"]
run = "bun scripts/rel-blockers.ts"

# The RelIR decline contract, over every corpus prefix × chain shape × fast-path switch. A gate and
# not an instrument because zero IS the contract: `lowerToRel` returning null defers to the legacy
# spine, but THROWING is the new spine erroring on a traversal the old one compiles.
[tasks.rel-sweep]
description = "RelIR decline contract: lowerToRel returns a plan or null over every corpus prefix, never throws"
depends = ["install"]
run = "bun scripts/rel-sweep.ts"
# Deterministic and file-driven: it sweeps test/L1-corpus/corpus.txt through the src compiler, so its
# inputs are entirely within these globs — safe to make incremental (this is what lets `mise run ci`
# skip the sweep on a re-run with an unchanged tree).
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]
[tasks.submodule]
description = "Provision the pinned submodules (blobless+sparse: tinkerpop, calcite) + build/register the client"
run = "bash scripts/init-submodule.sh"

# Every test task depends on `check` (tsc --noEmit): `bun test` runs TS WITHOUT type-checking,
# so a test run must gate on the type-check first — else a type error ships green under a bare
# `bun test` (which is how the build once went red after a refactor passed its tests).
[tasks.test]
description = "Full suite, fanned across cores: one `bun test` process per bracket, in parallel"
depends = ["install", "check", "submodule"]
# ONE command on purpose (was a two-command array). scripts/test-all.ts fans the suite out into the SAME
# brackets CI uses (scripts/brackets.ts), one `bun test <files>` child per bracket run CONCURRENTLY — so
# a 24-core box actually uses its cores instead of pinning ~1 on a single `bun test`. The browser bracket
# runs in its own child with the lane flag set (unminified locally; it self-skips without Chrome), which
# subsumes the old "browser second, in its own process" step. Single command because mise appends
# `-- <args>` to the LAST run command: with one command, `mise run test -- test/L3 -t foo` reaches
# test-all.ts as argv, which then takes a targeted single-process fast path. CI still fans by RUNNER
# (scripts/test-bracket.ts); this is the local mirror sharing the one bracket function.
run = "bun scripts/test-all.ts"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]
[tasks."test:cf-limits"]
description = "Instrument: L3 conformance with every compiled statement asserted Cloudflare-legal (≤100 binds)"
depends = ["install", "check", "submodule"]
# MOGWAI_CF_LIMITS wraps the L3 host's store factory with CfLimitedSql (conformance-server.ts) — the one
# deliberate seam. L3 runs the WHOLE feature corpus through the compiler on Bun (never a real DO), so it
# is where a data-scaling bind list would otherwise hide; the contract's DO-legality is enforced natively
# by the real DO in cloudflare.test.ts, and `mise run binds` catches the placeholder idiom statically.
env = { MOGWAI_CF_LIMITS = "1" }
run = "bun test test/L3-conformance"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# The BROWSER lane — Playwright drives a real (system) Chrome against the browser leaves (src/browser/*).
# Part of the normal gate now: the tests run under a bare `bun test` / `mise run ci` and get their own CI
# runner as the `browser` bracket (scripts/test-bracket.ts), like L1–L5. Each `describe` is
# `skipIf(!chromeAvailable())`, so a machine with no system Chrome (or `$MOGWAI_SKIP_BROWSER=1`) SKIPS them
# cleanly rather than failing; CI has Chrome, so the gate covers them there. This task is the local
# convenience for running JUST the lane. No submodule.
[tasks."test:browser"]
description = "Browser lane: Playwright → real Chrome over the browser leaves (OPFS, opfs-sahpool)"
depends = ["install", "check"]
# MOGWAI_RUN_BROWSER activates the lane (harness browserLaneEnabled); it runs in its OWN process, which is
# what keeps the heavy on-the-fly Bun.build reliable (mixed with the full suite it hits EBADF).
env = { MOGWAI_RUN_BROWSER = "1" }
# Trailing slash scopes to the directory — `bun test test/browser` is a PREFIX that would also pull in
# test/browser-wasm.test.ts (the Bun-only WASM contract, which must stay in the core gate).
run = "bun test test/browser/"

# Conformance ladder — invoke a single level directly. Every level now provisions the submodule
# whether it lists it or not, because `install` depends on it. The listing is kept where it is
# SEMANTIC — "this level reads submodule content" (L3/L4's corpus, L5/census's real Executor) — and
# omitted on L1/L2, which only parse and compile. Read a `submodule` entry below as a statement
# about what the task consumes, not as what makes it available.
[tasks.L1]
description = "L1 — corpus parse+chain (2,298 canonical traversals)"
depends = ["install", "check"]
run = "bun test test/L1-corpus"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

[tasks.L2]
description = "L2 — SQL snapshots (compile-to-SQL contract)"
depends = ["install", "check"]
run = "bun test test/L2-sql"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

[tasks.L3]
description = "L3 — official TinkerPop cucumber conformance over GraphBinary (ratcheted)"
depends = ["install", "check", "submodule"]
run = "bun test test/L3-conformance"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

[tasks.L4]
description = "L4 — our addendum Gherkin suite (gap coverage; all must pass)"
depends = ["install", "check", "submodule"]
run = "bun test test/L4-addendum"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

[tasks.L5]
description = "L5 — property-based fast-path differential (HEAD-derived seed)"
# `submodule` listed explicitly, unlike L1/L2: the differential EXECUTES its traversals through the
# real Executor, which frames results via src/io.ts → `gremlin/io` — an export only the master
# client has. Anything that runs a traversal consumes submodule content; parsing and compiling do
# not. (Since `gremlin` became a link: dep this can no longer resolve to npm's beta.2 by accident —
# the install fails instead — so the entry is documentation of the need, not the mechanism.)
depends = ["install", "check", "submodule"]
run = "bun test test/L5-properties"
# Incremental at a FIXED HEAD (deterministic), but its seed is HEAD-derived — see the note on the
# `[tasks.check]` block: a re-run after a new commit that touched no source will skip with the old seed.
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# The DEEP sweep: a random seed and a much larger sample. Findings get diagnosed into
# test/L5-properties/known.ts (or fixed), then promoted into an L4 .feature so the floor rises.
#
# Not in `ci` only because of its SIZE (3000 traversals). Ordinary L5 derives its seed from HEAD,
# so CI and a local checkout of the same commit draw the same corpus; this deeper sweep remains
# intentionally random for breadth and prints its seed for reproduction.
[tasks.L5-random]
description = "L5 exploration — random seed, 3000 generated traversals (not a CI gate)"
depends = ["install", "check", "submodule"]
# mise's task shell is not required to provide Bash's $RANDOM. Ask Bun for a portable positive
# integer explicitly, then pass it through the normal L5_SEED reproduction channel.
run = "L5_SEED=$(bun -e 'console.log(Math.floor(Math.random() * 0x7fffffff))') L5_RUNS=3000 bun test test/L5-properties"

# The refactor guard, NOT a ladder level: it asserts nothing about correctness, only that behaviour
# has not CHANGED. `submodule` because it executes traversals (same reason as L5). It lives in
# `test/L7-census/` so the CI bracket function gives it its OWN runner (`test (L7)`) instead of dragging
# the `other` bracket — the `L7` name is the bracket mechanism (path → runner), and the deliberate gap
# after L5 marks that it is not the next conformance rung. `mise run census` stays its human-facing name.
[tasks.census]
description = "Census — the refactor guard: every corpus traversal's outcome vs the committed baseline"
depends = ["install", "check", "submodule"]
run = "bun test test/L7-census"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# Re-record the baseline. Deliberately a command rather than the test rewriting itself: the census
# is a two-way baseline, so an auto-record would launder the very regression it exists to catch.
[tasks.census-record]
description = "Re-record the census baseline (prints the delta first; commit the two .tsv files)"
depends = ["install", "check", "submodule"]
run = "bun run test/L7-census/record.ts"

[tasks.generate]
description = "Regenerate parser/ + parser/gql/ from the submodule's origin/master grammars (antlr-ng)"
depends = ["install", "submodule"]
run = "bash scripts/generate-parser.sh"

[tasks.regen-corpus]
description = "Re-extract the L1 corpus.txt from the submodule's origin/master Gherkin features"
depends = ["submodule"]
run = "bun run test/L1-corpus/regen-corpus.ts"

[tasks.version]
description = "Print the derived release version (major from package.json · commit count · build/timestamp)"
run = "bun scripts/version.ts"

[tasks.package]
description = "Build the release artifacts under dist/: the browser zip + the Bun binaries (all targets)"
depends = ["install"]
run = "bun scripts/package.ts"

[tasks."package:browser"]
description = "Just the browser zip: dist/browser/{mogwai,service-worker,worker}.js + sqlite3.wasm, zipped"
depends = ["install"]
run = "bun scripts/package.ts --browser"

[tasks."package:binaries"]
description = "Just the Bun standalone binaries (pass a subset via `--binaries=linux-x64,darwin-arm64`)"
depends = ["install"]
run = "bun scripts/package.ts --binaries"

[tasks."package:cloudflare"]
description = "Just the Cloudflare zip: the prebuilt Worker + a wrangler.jsonc deploy template + README"
depends = ["install"]
run = "bun scripts/package.ts --cloudflare"

[tasks.build]
description = "Bundle the Cloudflare Worker (dry-run deploy)"
# `submodule` listed explicitly: the worker bundles src/io.ts, which imports `gremlin/io` — and,
# via two hard relative paths into `node_modules/gremlin/…`, a deep StreamReader and the Translator.
# Those relative imports are why the client must be PHYSICALLY present at `node_modules/gremlin`
# (resolving it through tsconfig `paths` instead was tried and fails this bundle), and why the
# link: dep is a symlink rather than a copy. This used to go red in CI only, when npm's beta.2 —
# which has no `./io` export — got installed in place of the link; that route is now closed.
depends = ["install", "submodule"]
run = "bunx wrangler deploy --dry-run --outdir dist"
# Bundles src/cloudflare/worker.ts (+ everything it imports, all under src/ and the generated parser)
# per wrangler.jsonc — so those files are its inputs. Incremental so the ~seconds dry-run deploy in the
# `gates` group skips on an unchanged tree.
sources = ["src/**/*", "parser/**/*", "wrangler.jsonc", "tsconfig.json", "package.json", "bun.lock"]

# ONE BRACKET of the suite, for a CI runner of its own. `bun test` is a single process and bun does
# not parallelise across files, so the suite is a serial CPU pole; the only thing that shortens it is
# more RUNNERS, not more processes on one (measured: 2 shards ∥ 2 sweep shards on a 4-core pin took
# 66.8s against 72.9s unsharded — every extra bun process re-pays JIT warmup).
#
# The brackets are DERIVED from discovery, not a hand-written path list: `test/L<n>-…` → bracket
# `L<n>`, everything else → `other`. So their union is the whole suite by construction, a new test
# file cannot land outside every bracket, and a new `test/L6-…/` dir becomes its own `L6` runner with
# no edit here — see scripts/test-bracket.ts. The bracket names are the point: a red `test (L2)` in
# the CI UI says "run `mise run L2` locally" without opening the job. The CI workflow reads the
# bracket list from `--matrix` (one plan job) and fans a runner out per bracket.
#
# NO `check` EDGE, and it is the one test task without one. Every other test task gates on
# `tsc --noEmit` because `bun test` runs TS without type-checking, so a type error would otherwise ship
# green. That reasoning is about the GATE, not about each process: this task exists for CI, where
# `gates` runs `check` on a runner of its own and the aggregating job refuses to pass unless it
# succeeded. Keeping the edge here would re-run the type-check on every bracket runner and put it on
# each one's critical path before `bun test` could start, for a property already being proved next door.
# `mise run test` keeps its edge and remains what a human runs.
[tasks."test:bracket"]
description = "One bracket of the suite for CI (MOGWAI_BRACKET=L1|…|other); brackets partition discovery by L-level"
depends = ["install", "submodule"]
run = "bun scripts/test-bracket.ts"
[tasks.sql-hygiene]
description = "Instrument: RelIR authored-corpus literal provenance and DO SQL-wall sweep"
depends = ["install"]
run = "bun scripts/sql-hygiene.ts"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]

# EXPLAIN QUERY PLAN over every compiled corpus read. Instrument for the temp-b-tree count (needs
# judgement), gate for base-table scans (zero today; the base tables are reached through covering
# indexes, so a scan means the emitted SQL dropped an index path — exits 1). Source + fixture data
# only, same `depends` as sql-hygiene: it compiles and runs SQL, it never frames a result.
[tasks.sql-plan]
description = "Instrument+gate: EXPLAIN QUERY PLAN over corpus reads — no base-table scan; temp-b-trees reported"
depends = ["install"]
run = "bun scripts/sql-plan.ts"

[tasks.sql-hygiene-record]
description = "Bank the sql-hygiene per-family maxima (commit scripts/sql-hygiene-baseline.json)"
depends = ["install"]
run = "bun scripts/sql-hygiene.ts --record"

# An ENV switch rather than a parameter, deliberately: the suite under test must not be able to see
# that it is being perturbed.
[tasks."test:perturbed"]
description = "Instrument: the full suite under reversed unordered scans (finds order-by-luck results)"
depends = ["install", "check", "submodule"]
env = { MOGWAI_REVERSE_UNORDERED = "1" }
run = "bun test"
sources = ["src/**/*", "test/**/*", "scripts/**/*", "parser/**/*", "tsconfig.json", "bunfig.toml", "package.json", "bun.lock", "!test/**/l3-telemetry.*", "!test/**/.wrangler/**"]


# The static half of the gate, grouped so CI can put it on a runner of its own. Every member finishes
# within ~7s of `install`, so as a group it is free — it exists to be a JOB, not because anyone needs
# to run the six separately.
[tasks.gates]
description = "The static gates: type-check + lint + architectural + bind-budget + SQL hygiene + deletion & edge ratchets + worker build"
depends = ["check", "lint", "arch", "binds", "sql-hygiene", "build"]
run = "echo 'gates passed'"

# THE LOCAL one-command gate, and still the complete one: `mise run ci` runs everything CI runs.
#
# CI no longer invokes this task — it fans the same work across runners (`gates`, `rel-sweep`, and one
# `test:bracket` per bracket, discovered dynamically) because one runner has 4 cores and `test` alone
# saturates barely more than one of them. The COVERAGE is identical by construction, and this
# dependency list is where that is checkable: CI's jobs are exactly `gates` + `rel-sweep` + `test` (as
# brackets whose union is `test`). Keep the two in step — a job added here without a job there is a
# gate that only fires locally.
[tasks.ci]
description = "CI gate: the static gates + RelIR decline contract + the full suite (locally: all of it, in one command)"
depends = ["gates", "rel-sweep", "test"]
run = "echo 'CI passed'"
